<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>HRMS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
        }
        .header {
            background: white;
            padding: 16px 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; color: #1a1a2e; }
        .user-info { display: flex; align-items: center; gap: 16px; }
        .user-info .name { font-weight: 500; }
        .user-info .logout { color: #dc3545; cursor: pointer; }
        .dashboard {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .stat-card h3 { font-size: 14px; color: #666; margin-bottom: 8px; }
        .stat-card .number { font-size: 28px; font-weight: 700; color: #1a1a2e; }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .action-btn {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .action-btn:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }
        .action-btn .icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .action-btn .label { font-size: 14px; color: #333; font-weight: 500; }
        .section { background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .section h2 { font-size: 18px; margin-bottom: 16px; color: #1a1a2e; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { font-weight: 600; color: #666; font-size: 13px; text-transform: uppercase; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 { margin-bottom: 20px; }
        .modal-content .form-group { margin-bottom: 16px; }
        .modal-content .form-group label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px; }
        .modal-content .form-group input,
        .modal-content .form-group select,
        .modal-content .form-group textarea {
            width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;
        }
        .modal-content .form-group input:focus,
        .modal-content .form-group select:focus,
        .modal-content .form-group textarea:focus {
            outline: none; border-color: #667eea;
        }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .modal-actions button { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-danger { background: #dc3545; color: white; }
        .close-modal { float: right; font-size: 24px; cursor: pointer; color: #999; }
        .close-modal:hover { color: #333; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏢 HRMS Dashboard</h1>
        <div class="user-info">
            <span class="name" id="userName">Loading...</span>
            <span style="color:#666; font-size:14px;" id="userRole"></span>
            <span class="logout" onclick="logout()">🚪 Logout</span>
        </div>
    </div>

    <div class="dashboard">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><h3>📅 Leave Balance</h3><div class="number" id="leaveBalance">--</div></div>
            <div class="stat-card"><h3>📋 Pending Requests</h3><div class="number" id="pendingRequests">--</div></div>
            <div class="stat-card"><h3>⏱️ This Month</h3><div class="number" id="monthlyLeaves">--</div></div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <div class="action-btn" onclick="openModal('leave')">
                <span class="icon">📝</span>
                <span class="label">Apply Leave</span>
            </div>
            <div class="action-btn" onclick="openModal('attendance')">
                <span class="icon">✅</span>
                <span class="label">Mark Attendance</span>
            </div>
            <div class="action-btn" onclick="openModal('profile')">
                <span class="icon">👤</span>
                <span class="label">My Profile</span>
            </div>
            <div class="action-btn" onclick="window.location.href='?page=reports'">
                <span class="icon">📊</span>
                <span class="label">Reports</span>
            </div>
        </div>

        <!-- Leave History -->
        <div class="section">
            <h2>📋 My Leave History</h2>
            <div id="leaveHistory">
                <table>
                    <thead><tr><th>Date</th><th>Type</th><th>Duration</th><th>Status</th></tr></thead>
                    <tbody id="leaveTableBody">
                        <tr><td colspan="4" style="text-align:center; color:#999;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Attendance This Month -->
        <div class="section">
            <h2>✅ Attendance This Month</h2>
            <div id="attendanceTable">
                <table>
                    <thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Hours</th></tr></thead>
                    <tbody id="attendanceBody">
                        <tr><td colspan="4" style="text-align:center; color:#999;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Leave Application Modal -->
    <div class="modal" id="leaveModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('leaveModal')">&times;</span>
            <h2>📝 Apply for Leave</h2>
            <form id="leaveForm">
                <div class="form-group">
                    <label>Leave Type</label>
                    <select id="leaveType" required>
                        <option value="annual">Annual Leave</option>
                        <option value="sick">Sick Leave</option>
                        <option value="casual">Casual Leave</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="leaveFrom" required>
                </div>
                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="leaveTo" required>
                </div>
                <div class="form-group">
                    <label>Reason</label>
                    <textarea id="leaveReason" rows="3" placeholder="Brief description"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">Submit Request</button>
                    <button type="button" class="btn-secondary" onclick="closeModal('leaveModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('hrms_user') || '{}');
        const token = sessionStorage.getItem('hrms_token');

        // ============================================
        // INITIALIZE DASHBOARD
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            if (!token || !user.empId) {
                window.location.href = '/';
                return;
            }

            document.getElementById('userName').textContent = user.name || 'Employee';
            document.getElementById('userRole').textContent = user.role || '';

            loadDashboardData();
        });

        function loadDashboardData() {
            google.script.run
                .withSuccessHandler(function(data) {
                    if (data.success) {
                        document.getElementById('leaveBalance').textContent = data.leaveBalance || '0';
                        document.getElementById('pendingRequests').textContent = data.pendingRequests || '0';
                        document.getElementById('monthlyLeaves').textContent = data.monthlyLeaves || '0';
                        renderLeaveHistory(data.leaveHistory || []);
                        renderAttendance(data.attendance || []);
                    }
                })
                .withFailureHandler(function(error) {
                    console.error('Error loading dashboard:', error);
                })
                .getDashboardData(token);
        }

        function renderLeaveHistory(leaves) {
            const tbody = document.getElementById('leaveTableBody');
            if (!leaves || leaves.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999;">No leave records</td></tr>';
                return;
            }
            tbody.innerHTML = leaves.map(leave => `
                <tr>
                    <td>${leave.from} to ${leave.to}</td>
                    <td>${leave.type}</td>
                    <td>${leave.duration} days</td>
                    <td><span class="status-badge status-${leave.status}">${leave.status}</span></td>
                </tr>
            `).join('');
        }

        function renderAttendance(attendance) {
            const tbody = document.getElementById('attendanceBody');
            if (!attendance || attendance.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999;">No attendance records</td></tr>';
                return;
            }
            tbody.innerHTML = attendance.map(day => `
                <tr>
                    <td>${day.date}</td>
                    <td>${day.checkIn || '--'}</td>
                    <td>${day.checkOut || '--'}</td>
                    <td>${day.hours || '0'}</td>
                </tr>
            `).join('');
        }

        // ============================================
        // MODAL CONTROLS
        // ============================================
        function openModal(type) {
            if (type === 'leave') {
                document.getElementById('leaveModal').classList.add('show');
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        // Click outside modal to close
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });

        // ============================================
        // LEAVE APPLICATION
        // ============================================
        document.getElementById('leaveForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const leaveData = {
                empId: user.empId,
                type: document.getElementById('leaveType').value,
                from: document.getElementById('leaveFrom').value,
                to: document.getElementById('leaveTo').value,
                reason: document.getElementById('leaveReason').value,
                token: token
            };

            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        alert('Leave request submitted successfully!');
                        closeModal('leaveModal');
                        document.getElementById('leaveForm').reset();
                        loadDashboardData(); // Refresh data
                    } else {
                        alert(response.message || 'Failed to submit leave request.');
                    }
                })
                .withFailureHandler(function(error) {
                    alert('Error submitting leave request. Please try again.');
                    console.error(error);
                })
                .applyLeave(leaveData);
        });

        // ============================================
        // LOGOUT
        // ============================================
        function logout() {
            google.script.run
                .withSuccessHandler(function() {
                    sessionStorage.clear();
                    window.location.href = '/';
                })
                .logout(token);
        }
    </script>
</body>
</html>
